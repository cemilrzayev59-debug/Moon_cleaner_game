<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ayın Səthini Təmizləmək</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .choose-btn { touch-action: manipulation; }
    #err-box {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
      background: #7f1d1d; color: #fff; font: 12px monospace; padding: 8px; white-space: pre-wrap;
    }
  </style>

  <script>
    function showErr(text) {
      var box = document.getElementById('err-box');
      if (!box) { return; }
      box.style.display = 'block';
      box.textContent += text + '\n';
    }
    window.addEventListener('error', function (e) {
      showErr('Xəta: ' + (e.message || 'naməlum') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showErr('Promise xətası: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  </script>

  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.8.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="err-box"></div>

  <div id="game-container"></div>
  <div id="hud">
    <div id="hud-money">💰 0</div>
    <div id="hud-bag">🎒 0.00/1.00 kq</div>
  </div>
  <div id="version-tag">v0.9.3</div>

  <div id="minimap-box">
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="cleaned-percent">Təmizlənib: 0.0%</div>
    <div id="chunk-info">Parça: 0%</div>
