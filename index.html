<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ayın Səthini Təmizləmək</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container"></div>
  <div id="hud">
    <div id="hud-money">💰 0</div>
    <div id="hud-bag">🎒 0.00/1.00 kq</div>
  </div>
  <div id="version-tag">v0.9.3</div>

  <div id="minimap-box">
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="cleaned-percent">Təmizlənib: 0.0%</div>
    <div id="chunk-info">Parça: 0%</div>
    <div id="base-info">Baza: 0 m</div>
  </div>

  <div id="toast"></div>
  <div id="pc-hint"></div>

  <div id="shop-panel">
    <div id="shop-title"></div>
    <div id="shop-info"></div>
    <button id="shop-buy">Al</button>
  </div>

  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>
  <div id="camera-area"></div>
  <button id="action-btn" oncontextmenu="return false;">🪥</button>

  <div id="start-screen">
    <div id="start-box">
      <h1>Ayın Səthini Təmizləmək</h1>
      <p>Hansı cihazda oynayırsan?</p>
      <button id="choose-phone" class="choose-btn" type="button">📱 Telefon</button>
      <button id="choose-pc" class="choose-btn" type="button">💻 Kompüter</button>
      <div id="start-status">Oyun faylları yüklənir...</div>
    </div>
  </div>

  <!-- Klassik skript (module deyil): düymələr həmişə işləsin deyə -->
  <script src="js/boot.js"></script>
</body>
</html>
